<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ShopNest - Forgot Password</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="auth-page">


    <!-- ================= HEADER ================= -->

    <header class="auth-header">

        <a
            href="index.html"
            class="auth-logo"
        >
            Shop<span>Nest</span>
        </a>

    </header>


    <!-- ================= FORGOT PASSWORD ================= -->

    <main class="auth-container">

        <div class="auth-card">

            <h1>
                Forgot Password
            </h1>

            <p class="auth-subtitle">
                Enter your registered email address to reset your password.
            </p>


            <!-- EMAIL -->

            <div class="auth-form-group">

                <label for="forgotEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="forgotEmail"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                >

            </div>


            <!-- NEW PASSWORD -->

            <div
                class="auth-form-group"
                id="newPasswordGroup"
                style="display: none;"
            >

                <label for="newPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter your new password"
                    autocomplete="new-password"
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div
                class="auth-form-group"
                id="confirmNewPasswordGroup"
                style="display: none;"
            >

                <label for="confirmNewPassword">
                    Re-enter New Password
                </label>

                <input
                    type="password"
                    id="confirmNewPassword"
                    placeholder="Re-enter your new password"
                    autocomplete="new-password"
                >

            </div>


            <!-- MESSAGE -->

            <div
                id="forgotMessage"
                class="auth-message"
                aria-live="polite"
            ></div>


            <!-- BUTTON -->

            <button
                type="button"
                class="auth-button"
                id="forgotPasswordButton"
                onclick="forgotPassword()"
            >
                Continue
            </button>


            <!-- BACK TO LOGIN -->

            <a
                href="login.html"
                class="auth-secondary-button"
            >
                Back to Sign in
            </a>

        </div>


        <!-- BACK TO HOME -->

        <a
            href="index.html"
            class="back-home"
        >
            ← Back to ShopNest
        </a>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="auth-footer">

        <div class="auth-footer-links">

            <a href="privacy.html">
                Privacy Notice
            </a>

            <a href="terms.html">
                Terms & Conditions
            </a>

            <a href="help.html">
                Help
            </a>

        </div>

        <p>
            © 2026 ShopNest. All rights reserved.
        </p>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>

</body>

</html>
